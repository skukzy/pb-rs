[workspace]
resolver = "2"
members = ["harness", "crates/pb-core", "crates/pb-api", "crates/pb-cli", "crates/pb-js"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
